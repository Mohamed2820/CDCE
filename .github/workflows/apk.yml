name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor project
        run: |
          mkdir -p app/www
          echo '<!doctype html><html><body></body></html>' > app/www/index.html
          cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.cdce.team","appName":"CDCE","webDir":"www","server":{"url":"https://mohamed2820.github.io/CDCE/","androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><uses-permission android:name="android.permission.CAMERA" /></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CDCE-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
