<script>

 if(!await q(sb.rpc('reset_with_recovery',{p:ph,c,newpw:pw})))return toast('الرقم أو كود الاسترجاع غلط');toast('اتغيرت كلمة السر ✅ سجّل دخول');mode='in';login()});

 if(!data.session){const r=await sb.auth.signInWithPassword({email:mail(ph),password:pw});if(r.error)throw r.error}
 const rec=genRec();try{await q(sb.rpc('set_recovery',{c:rec}));REC=rec}catch(e){}await boot()});

function guide(i){const o=$('#ov');if(i>=G.length){o.style.display='none';ls('cdce_seen','1');return}o.style.display='grid';

 const T=[['home','🏠','الرئيسية'],['depts','👥','الأقسام'],['pyr','🔺','الهرم'],['ann','📢','رسايل'],['general','💬','العام'],['ai','🤖','المساعد']];if(n(ME)>=2)T.push(['vip','⭐','VIP']);T.push(['me','👤','حسابي']);

let nd=0;const depts=()=>`<h2>أقسام الفريق</h2>`+(n(ME)>=2?(nd?`<div class="card"><input id="dnm" placeholder="اسم القسم"><input id="dem" placeholder="إيموجي (اختياري)" maxlength="4"><button class="btn g" onclick="addDept()">إضافة</button> <button class="btn o" onclick="nd=0;draw()">إلغاء</button></div>`:`<button class="btn" style="width:100%;margin-bottom:10px" onclick="nd=1;draw()">+ قسم جديد</button>`):'')+DEP.map(d=>`<div class="card row" onclick="go({t:'dept',id:'${d.id}'})"><div class="av">${esc(d.emoji||'👥')}</div><div class="grow"><b>${esc(d.name)}</b><div class="m">${P.filter(x=>x.department_id==d.id&&!x.is_memorial).length} فرد</div></div>›</div>`).join('');
function dept(){const d=DEP.find(x=>x.id==V.id),l=P.filter(x=>x.department_id==d.id&&!x.is_memorial).sort((a,b)=>n(b)-n(a)||b.points-a.points),ok=ME.department_id==d.id||ME.rank=='leader';
 return `<div class="row"><button class="btn o" onclick="go({t:'depts'})">‹</button><h2 class="grow">${esc(d.name)}</h2>${ok?`<button class="btn g" onclick="openRoom('dept:${d.id}','شات ${esc(d.name)}','dept:${d.id}')">💬 شات القسم</button>`:'<span class="tag">🔒 الشات لأعضاء القسم</span>'}</div><br>`+(l.map(x=>`<div class="card">${row(x)}</div>`).join('')||'<p class="m">لسه مفيش أفراد.</p>')}
const addDept=()=>{const nm=$('#dnm').value.trim();if(!nm)return toast('اكتب اسم القسم');run(async()=>{await q(sb.from('departments').insert({id:'d'+Date.now().toString(36),name:nm,emoji:$('#dem').value.trim()||'👥'}));nd=0;await load();draw()})};
const chip=(x,p='')=>`<span class="tag" style="font-size:14px" onclick="go({t:'prof',id:'${x.id}'})">${p}${esc(x.full_name)}</span>`;
const pyr=()=>`<h2>الهرم التنظيمي</h2>`+[4,3,2,1,0].map(r=>{const l=P.filter(x=>n(x)==r&&!x.is_memorial),o=r==4?P.filter(x=>x.is_memorial):[];
 return `<div class="card" style="text-align:center;margin-inline:${(4-r)*7}px"><div class="m">${RN[RKS[r]]}</div>${l.map(x=>chip(x)).join('')||(r==4?'':'<span class="m">-</span>')}${o.map(x=>chip(x,'🕊️ ')).join('')}</div>`}).join('');
const can=x=>n(ME)>=3&&n(ME)>n(x)&&!x.is_memorial&&x.rank!='leader';
const pbody=x=>`<div class="card" style="text-align:center">${av(x,'big')}<h2 style="margin-top:10px">${esc(x.full_name)}</h2>
 ${x.is_memorial?'<span class="tag">🕊️ ليدر سابق - الصفحة لإحياء ذكراه</span>':`<span class="tag">${RN[x.rank]}</span>${x.department_id?`<span class="tag">${esc(dn(x.department_id))}</span>`:''}${pts(x)}`}</div>
 ${x.is_memorial?'':`<div class="card"><h3>اللقب (الشهرة)</h3><p>${esc(x.title||'لسه ما اتحددش')}</p><p class="m">اللقب بيتحدد بتصويت أغلبية الهيدات.</p>
 <h3>الكلية والفرقة</h3><p>${esc(x.college||'-')} • ${esc(x.year_status||'-')}</p><h3>أقدر أقدم للفريق</h3><p>${esc(x.offer||'-')}</p></div>`}`;
function prof(){const x=P.find(y=>y.id==V.id);if(!x)return'';const ld=ME.rank=='leader'&&!x.is_memorial&&x.id!=ME.id;
 return `<button class="btn o" onclick="go({t:'${x.department_id?'dept':'home'}',id:'${x.department_id||''}'})">‹ رجوع</button><br><br>`+pbody(x)+
 (!x.is_memorial&&x.id!=ME.id?`<button class="btn" style="width:100%;margin-bottom:10px" onclick="openRoom('dm:'+[ME.id,'${x.id}'].sort().join('_'),'${esc(x.full_name)}','prof:${x.id}')">💬 مراسلة خاصة</button>`:'')+
 (can(x)?`<div class="card"><h3>إدارة النقاط</h3><div class="row"><button class="btn g grow" onclick="adj('${x.id}',10)">+10</button><button class="btn r grow" onclick="adj('${x.id}',-10)">-10</button></div><p class="m">مفيش خصم أو إضافة بين نفس الرتبة.</p></div>`:'')+
 (ld?`<div class="card"><h3>إدارة (الليدر)</h3><select id="er">${RKS.slice(0,4).map(k=>`<option value="${k}" ${k==x.rank?'selected':''}>${RN[k]}</option>`).join('')}</select>
 <select id="ed2">${DEP.map(d=>`<option value="${d.id}" ${d.id==x.department_id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><input id="et" placeholder="اللقب" value="${esc(x.title||'')}"><button class="btn" onclick="adm('${x.id}')">حفظ</button></div>`:'')}
const adj=(id,d)=>run(async()=>{const x=P.find(y=>y.id==id);await q(sb.from('profiles').update({points:x.points+d}).eq('id',id));await load();draw()});
const adm=id=>run(async()=>{await q(sb.from('profiles').update({rank:$('#er').value,department_id:$('#ed2').value,title:$('#et').value.trim()||null}).eq('id',id));await load();draw()});
/* chat */
const curRoom=()=>V.t=='vip'?'vip':V.room,msHtml=()=>MS.map(m=>`<div class="bub ${m.sender==ME.id?'me':''}"><small>${esc(nameBy(m.sender))}</small>${esc(m.content)}</div>`).join('')||'<p class="m">لسه مفيش رسايل.</p>';
const paintMs=()=>{const e=$('#ms');if(e){e.innerHTML=msHtml();$('#v').scrollTop=1e9}};
let rt;function subRt(){if(rt)return;rt=sb.channel('m').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{const m=p.new;if(m.room==curRoom()&&(V.t=='chat'||V.t=='vip'&&sub=='chat')&&!MS.some(x=>x.id==m.id)){MS.push(m);paintMs()}}).subscribe()}
const chatBody=r=>`<div class="msgs" id="ms">${msHtml()}</div>`+((r!='ann'||n(ME)>=2)?`<div class="send"><input id="mi" placeholder="اكتب رسالة" onkeydown="if(event.key=='Enter')sendM()"><button class="btn" onclick="sendM()">➤</button></div>`:'<div class="card m">الرسايل هنا للليدر والهيدات ومساعديهم بس.</div>');
const openRoom=(room,title,back)=>run(async()=>{if(room=='ann'||room=='vip')try{await sb.rpc('finalize_polls')}catch(e){}
 MS=(await q(sb.from('messages').select('*').eq('room',room).order('id',{ascending:false}).limit(100))).reverse();V={t:room=='vip'?'vip':'chat',room,title,back};draw()});
const chat=()=>`<div class="row">${V.back?`<button class="btn o" onclick="bk('${V.back}')">‹</button>`:''}<h2>${esc(V.title)}</h2></div>`+chatBody(V.room);
function bk(b){if(b=='me')openMe();else{const[k,i]=b.split(':');go(k=='prof'?{t:'prof',id:i}:{t:'dept',id:i})}}
const sendM=()=>{const i=$('#mi'),t=i.value.trim();if(!t)return;i.value='';run(async()=>{const m=await q(sb.from('messages').insert({room:curRoom(),content:t}).select().single());if(!MS.some(x=>x.id==m.id))MS.push(m);paintMs()})};
const ai=()=>`<h2>المساعد الذكي</h2><div class="card">🤖 المساعد الذكي هيتضاف في الإصدار الجاي، وهيشتغل بأقوى ذكاء اصطناعي مجاني متاح وبيتبدّل تلقائياً.</div>`;
/* VIP */
const loadPolls=async()=>{PL=await q(sb.from('polls').select('*').order('created_at',{ascending:false}));VT=await q(sb.from('poll_votes').select('*'))};
const vip=()=>`<div class="sub"><button class="btn ${sub=='chat'?'':'o'}" onclick="sub='chat';openRoom('vip','VIP')">شات VIP</button><button class="btn ${sub=='polls'?'':'o'}" onclick="subP()">التصويتات</button></div>`+(sub=='chat'?chatBody('vip'):polls());
const subP=()=>run(async()=>{sub='polls';try{await sb.rpc('finalize_polls')}catch(e){}await loadPolls();V={t:'vip',room:'vip'};draw()});
function polls(){const c=P.filter(x=>!x.is_memorial&&x.rank!='leader'&&x.id!=ME.id);
 const f=ps?`<div class="card"><select id="pt">${c.map(x=>`<option value="${x.id}">${esc(x.full_name)} (${RN[x.rank]})</option>`).join('')}</select><input id="pn" placeholder="عنوان التصويت"><textarea id="po" rows="4" placeholder="كل اختيار في سطر. الاختيار الأول = موافقة"></textarea>
 <select id="pd"><option value="1">دقيقة (تجربة)</option><option value="60">ساعة</option><option value="360">6 ساعات</option><option value="1440">يوم</option><option value="4320">3 أيام</option></select><button class="btn g" onclick="mkPoll()">إنشاء</button> <button class="btn o" onclick="ps=0;draw()">إلغاء</button></div>`:`<button class="btn" style="width:100%;margin-bottom:10px" onclick="ps=1;draw()">+ تصويت جديد</button>`;
 return f+PL.map(p=>{const v=VT.find(x=>x.poll_id==p.id&&x.voter==ME.id),open=p.status=='open'&&new Date(p.ends_at)>new Date(),cn=i=>VT.filter(x=>x.poll_id==p.id&&x.choice==i).length;
  return `<div class="card"><b>${esc(p.title)}</b><div class="m">على: ${esc(nameBy(p.target))} • من: ${esc(nameBy(p.created_by))}</div>`+(open?`<div class="m">ينتهي: ${new Date(p.ends_at).toLocaleString('ar-EG')}</div>`+(p.target==ME.id?'<div class="m">التصويت عليك، مش هتصوّت.</div>':p.options.map((o,i)=>`<button class="btn ${v&&v.choice==i?'g':'o'}" style="width:100%;margin:3px 0" onclick="vote('${p.id}',${i})">${esc(o)}</button>`).join('')+(v?`<div class="m">تعديلات متبقية: ${3-v.changes}</div>`:'')):`<div>${p.status=='approved'?'✅ تمت الموافقة':p.status=='rejected'?'❌ مرفوض':'⏳ بيتحسب...'}</div>`+p.options.map((o,i)=>`<div class="m">${esc(o)}: ${cn(i)}</div>`).join(''))+'</div>'}).join('')}
const mkPoll=()=>{const o=$('#po').value.split('\n').map(s=>s.trim()).filter(Boolean),t=$('#pn').value.trim();if(!t||o.length<2||!$('#pt').value)return toast('اكتب عنوان واختيارين على الأقل');
 run(async()=>{await q(sb.from('polls').insert({target:$('#pt').value,title:t,options:o,ends_at:new Date(Date.now()+$('#pd').value*60000).toISOString()}));ps=0;await loadPolls();draw()})};
const vote=(id,i)=>run(async()=>{const v=VT.find(x=>x.poll_id==id&&x.voter==ME.id);if(v)await q(sb.from('poll_votes').update({choice:i}).eq('poll_id',id).eq('voter',ME.id));else await q(sb.from('poll_votes').insert({poll_id:id,choice:i}));await loadPolls();draw()});
setInterval(()=>{if(U&&V.t=='vip'&&sub=='polls'&&!ps)run(async()=>{try{await sb.rpc('finalize_polls')}catch(e){}await loadPolls();draw()})},20000);
/* account */
const openMe=()=>run(async()=>{const r=await q(sb.from('messages').select('room').like('room','dm:%').order('id',{ascending:false}).limit(200));DMS=[...new Set(r.map(x=>x.room))];
 RES=n(ME)>=3?await q(sb.rpc('list_resets')):[];CODES=ME.rank=='leader'?await q(sb.from('invite_codes').select('*').order('created_at',{ascending:false})):[];V={t:'me'};draw()});
function mine(){return pbody(ME)+`<div class="card"><h3>أقدر أقدم للفريق</h3><input id="of" value="${esc(ME.offer||'')}"><button class="btn o" onclick="saveOf()">حفظ</button>
 <h3>صورتي</h3><input type="file" accept="image/*" onchange="upImg(this.files[0],'avatars/'+U.id+'/a.jpg',300,u=>q(sb.from('profiles').update({avatar_url:u}).eq('id',ME.id)))">
 <h3>تغيير كلمة السر</h3><input id="np" type="password" placeholder="كلمة السر الجديدة"><button class="btn o" onclick="chPw()">تغيير</button></div>
 <div class="card"><h3>محادثاتي الخاصة</h3>${DMS.map(r=>{const o=r.slice(3).split('_').find(x=>x!=ME.id);return `<div class="row" style="padding:6px 0" onclick="openRoom('${r}','${esc(nameBy(o))}','me')">💬 <b>${esc(nameBy(o))}</b></div>`}).join('')||'<p class="m">مفيش محادثات خاصة لسه.</p>'}</div>
 ${RES.length?`<div class="card"><h3>طلبات نسيان كلمة السر</h3>${RES.map(r=>`<div class="memo"><b>${esc(r.full_name)}</b> <span class="tag">${RN[r.rank]}</span><input id="rp_${r.id}" placeholder="كلمة سر مؤقتة (6+)"><button class="btn g" onclick="doReset('${r.id}')">تعيين</button></div>`).join('')}</div>`:''}
 ${ME.rank=='leader'?`<div class="card"><h3>أكواد الدعوة</h3><select id="cr">${RKS.slice(0,4).map(k=>`<option value="${k}">${RN[k]}</option>`).join('')}</select><select id="cd">${DEP.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><input id="cl" placeholder="اسم الشخص (للتذكير)"><button class="btn" onclick="mkCode()">إنشاء كود</button>
 ${CODES.map(c=>`<div class="memo"><b style="letter-spacing:2px">${esc(c.code)}</b> <span class="tag">${RN[c.rank]}</span><span class="tag">${esc(dn(c.department_id))}</span><div class="m">${esc(c.label||'')} ${c.used_by?'• ✅ اتستخدم: '+esc(nameBy(c.used_by)):'• متاح'}</div></div>`).join('')}</div>`:''}
 <button class="btn o" style="width:100%;margin-bottom:8px" onclick="newRec()">🔑 إنشاء كود استرجاع جديد</button><button class="btn o" style="width:100%;margin-bottom:8px" onclick="guide(0)">📖 دليل التطبيق ومعنى الرتب</button><button class="btn r" style="width:100%" onclick="out()">تسجيل خروج</button><button class="btn o" style="width:100%;margin-top:8px;color:var(--r);border-color:var(--r)" onclick="delMe()">🗑️ حذف حسابي</button>`}
const saveOf=()=>run(async()=>{await q(sb.from('profiles').update({offer:$('#of').value}).eq('id',ME.id));await load();draw()});
const chPw=()=>run(async()=>{const p=$('#np').value;if(p.length<6)return toast('كلمة السر لازم 6 حروف على الأقل');const{error}=await sb.auth.updateUser({password:p});if(error)throw error;toast('اتغيرت كلمة السر ✅');$('#np').value=''});
const mkCode=()=>run(async()=>{const c=await q(sb.rpc('make_code',{r:$('#cr').value,d:$('#cd').value,lbl:$('#cl').value||null}));toast('الكود: '+c);await openMe()});
const doReset=id=>run(async()=>{await q(sb.rpc('admin_reset',{req:id,newpw:$('#rp_'+id).value}));toast('اتعيّنت كلمة السر المؤقتة ✅');await openMe()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
