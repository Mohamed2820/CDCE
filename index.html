const rtick=()=>{const e=$('#rt');if(e&&REC2)e.textContent=fmt(Math.round((Date.now()-REC2.t0)/1000))};
async function recStart(){if(!window.MediaRecorder||!navigator.mediaDevices)return toast('المتصفح مش بيدعم التسجيل');
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),ch=[];mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};REC2={mr,st,ch,t0:Date.now(),iv:setInterval(rtick,500)};mr.start();$('#cn').style.display='none';$('#cr').style.display='flex'}catch(e){toast('اسمح بالميكروفون من إعدادات المتصفح')}}
function recStop(snd){const r=REC2;if(!r)return;REC2=null;clearInterval(r.iv);const d=Math.round((Date.now()-r.t0)/1000);
 r.mr.onstop=()=>{r.st.getTracks().forEach(t=>t.stop());if(!snd||d<1)return;const mt=(r.mr.mimeType||'audio/webm').split(';')[0],ext=mt.includes('mp4')?'m4a':mt.includes('ogg')?'ogg':'webm';sendMedia(new Blob(r.ch,{type:mt}),'audio',ext,null,d)};
 r.mr.stop();const a=$('#cr'),c=$('#cn');if(a){a.style.display='none';c.style.display='flex'}}

 <h3>اللقب (الشهرة)</h3><input id="et" placeholder="اللقب" value="${esc(x.title||'')}"><button class="btn" onclick="setTitle('${x.id}')">حفظ اللقب</button>
 ${ME.rank=='leader'&&x.rank!='leader'?`<h3>الرتبة والقسم</h3><select id="er">${RKS.slice(0,4).map(k=>`<option value="${k}" ${k==x.rank?'selected':''}>${RN[k]}</option>`).join('')}</select><select id="ed2">${DEP.map(d=>`<option value="${d.id}" ${d.id==x.department_id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><button class="btn" onclick="adm('${x.id}')">حفظ</button>`:''}</div>`;return h}
const adj=(id,d)=>{if(!d)return toast('اكتب رقم');run(async()=>{const x=P.find(y=>y.id==id);await q(sb.from('profiles').update({points:x.points+d}).eq('id',id));await load();draw()})};
const setTitle=id=>run(async()=>{await q(sb.from('profiles').update({title:$('#et').value.trim()||null}).eq('id',id));await load();toast('اتحفظ ✅');draw()});
const adm=id=>run(async()=>{await q(sb.from('profiles').update({rank:$('#er').value,department_id:$('#ed2').value}).eq('id',id));await load();toast('اتحفظ ✅');draw()});
const sDep=()=>`<div class="card"><h3>قسم جديد</h3><input id="dnm" placeholder="اسم القسم"><input id="dem" placeholder="إيموجي (اختياري)" maxlength="4"><button class="btn g" onclick="addDept()">إضافة</button></div>`+DEP.map(d=>`<div class="card"><div class="row"><div class="av">${esc(d.emoji||'👥')}</div><b class="grow">${esc(d.name)}</b></div>${n(ME)>=3?`<input id="dn_${d.id}" value="${esc(d.name)}"><input id="de_${d.id}" value="${esc(d.emoji||'')}" maxlength="4"><div class="row"><button class="btn grow" onclick="editDept('${d.id}')">حفظ</button><button class="btn r" onclick="delDept('${d.id}')">حذف</button></div>`:'<p class="m">التعديل والحذف للهيد والليدر.</p>'}</div>`).join('');
const addDept=()=>{const nm=$('#dnm').value.trim();if(!nm)return toast('اكتب اسم القسم');run(async()=>{await q(sb.from('departments').insert({id:'d'+Date.now().toString(36),name:nm,emoji:$('#dem').value.trim()||'👥'}));await load();toast('اتضاف ✅');draw()})};
const editDept=id=>run(async()=>{await q(sb.from('departments').update({name:$('#dn_'+id).value.trim(),emoji:$('#de_'+id).value.trim()||'👥'}).eq('id',id));await load();toast('اتحفظ ✅');draw()});
const delDept=id=>{if(!confirm('حذف القسم؟ الأعضاء هيفضلوا من غير قسم.'))return;run(async()=>{await q(sb.from('departments').delete().eq('id',id));await load();draw()})};
function sTeam(){const lf=ME.rank=='leader',L=ST.links||[],o=P.filter(x=>x.is_memorial);
 return `<div class="card"><h3>نبذة عنا</h3>${lf?`<textarea id="eab" rows="4">${esc(ST.about)}</textarea><h3>تاريخنا</h3><textarea id="ehi" rows="4">${esc(ST.history)}</textarea><button class="btn" onclick="saveAbout()">حفظ</button>`:'<p class="m">النبذة والتاريخ بيعدّلهم الليدر بس.</p>'}</div>
 <div class="card"><h3>اللينكات</h3>${L.map((k,i)=>`<div class="row" style="padding:4px 0"><span class="grow">${esc(k.t)}</span><button class="btn r" onclick="delLink(${i})">✕</button></div>`).join('')||'<p class="m">مفيش.</p>'}<input id="lt" placeholder="اسم اللينك"><input id="lu" placeholder="https://..."><button class="btn o" onclick="addLink()">إضافة لينك</button>
 <h3>QR Code</h3>${ST.qr_url?`<img class="qr" src="${esc(ST.qr_url)}">`:''}<label class="btn o" style="display:block;margin-top:6px">رفع صورة QR<input type="file" accept="image/*" hidden onchange="upImg(this.files[0],'team/qr.jpg',500,u=>q(sb.from('team_settings').update({qr_url:u}).eq('id',1)))"></label></div>
 <div class="card"><h3>🕊️ الليدر السابق</h3>${o.map(x=>`<div class="memo">${av(x)}<input id="mn_${x.id}" value="${esc(x.full_name)}"><input id="mt_${x.id}" placeholder="اللقب" value="${esc(x.title||'')}"><label class="btn o" style="display:block;margin:6px 0">صورة<input type="file" accept="image/*" hidden onchange="memPic('${x.id}',this.files[0])"></label><div class="row"><button class="btn grow" onclick="saveMem('${x.id}')">حفظ</button><button class="btn r" onclick="delMem('${x.id}')">حذف</button></div></div>`).join('')}<input id="nm" placeholder="اسم الليدر السابق"><button class="btn g" onclick="addMem()">+ إضافة بروفايل</button></div>`}
const saveAbout=()=>run(async()=>{await q(sb.from('team_settings').update({about:$('#eab').value,history:$('#ehi').value}).eq('id',1));await load();toast('اتحفظ ✅');draw()});
const memPic=(id,f)=>upImg(f,'team/memorial_'+id+'.jpg',400,u=>q(sb.from('profiles').update({avatar_url:u}).eq('id',id)));
const saveMem=id=>run(async()=>{await q(sb.from('profiles').update({full_name:$('#mn_'+id).value.trim()||'بدون اسم',title:$('#mt_'+id).value.trim()||null}).eq('id',id));await load();toast('اتحفظ ✅');draw()});
const delMem=id=>{if(!confirm('حذف بروفايل الليدر السابق؟'))return;run(async()=>{await q(sb.from('profiles').delete().eq('id',id));await load();draw()})};
const addMem=()=>{const nm=$('#nm').value.trim();if(!nm)return toast('اكتب الاسم');run(async()=>{await q(sb.from('profiles').insert({full_name:nm,is_memorial:true,rank:'leader',title:'الليدر السابق'}));await load();toast('اتضاف ✅');draw()})};
const sCodes=()=>`<div class="card"><h3>إنشاء كود</h3><select id="cr">${RKS.slice(0,4).map(k=>`<option value="${k}">${RN[k]}</option>`).join('')}</select><select id="cd">${DEP.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><input id="cl" placeholder="اسم الشخص (للتذكير)"><button class="btn" onclick="mkCode()">إنشاء كود</button></div>`+CODES.map(c=>{const e=ec==c.code&&!c.used_by;
 return `<div class="card"><b style="letter-spacing:2px">${esc(c.code)}</b> `+(e?`<select id="xr">${RKS.slice(0,4).map(k=>`<option value="${k}" ${k==c.rank?'selected':''}>${RN[k]}</option>`).join('')}</select><select id="xd">${DEP.map(d=>`<option value="${d.id}" ${d.id==c.department_id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><input id="xl" value="${esc(c.label||'')}"><button class="btn g" onclick="saveCode('${c.code}')">حفظ</button> <button class="btn o" onclick="ec=null;draw()">إلغاء</button>`:`<span class="tag">${RN[c.rank]}</span><span class="tag">${esc(dn(c.department_id))}</span><div class="m">${esc(c.label||'')} ${c.used_by?'• ✅ اتستخدم: '+esc(nameBy(c.used_by)):'• متاح'}</div><div class="row">${c.used_by||c.rank=='leader'?'':`<button class="btn o" onclick="ec='${c.code}';draw()">تعديل</button>`}<button class="btn r" onclick="delCode('${c.code}')">حذف</button></div>`)+'</div>'}).join('');
const mkCode=()=>run(async()=>{const c=await q(sb.rpc('make_code',{r:$('#cr').value,d:$('#cd').value,lbl:$('#cl').value||null}));toast('الكود: '+c);await openStg()});
const saveCode=c=>run(async()=>{await q(sb.from('invite_codes').update({rank:$('#xr').value,department_id:$('#xd').value,label:$('#xl').value||null}).eq('code',c));ec=null;await openStg()});
const delCode=c=>{if(!confirm('حذف الكود '+c+'؟'))return;run(async()=>{await q(sb.from('invite_codes').delete().eq('code',c));await openStg()})};
const sRst=()=>`<div class="card"><h3>طلبات نسيان كلمة السر</h3>${RES.map(r=>`<div class="memo"><b>${esc(r.full_name)}</b> <span class="tag">${RN[r.rank]}</span><input id="rp_${r.id}" placeholder="كلمة سر مؤقتة (6+)"><button class="btn g" onclick="doReset('${r.id}')">تعيين</button></div>`).join('')||'<p class="m">مفيش طلبات.</p>'}</div>`;
const doReset=id=>run(async()=>{await q(sb.rpc('admin_reset',{req:id,newpw:$('#rp_'+id).value}));toast('اتعيّنت كلمة السر المؤقتة ✅');await openStg()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
