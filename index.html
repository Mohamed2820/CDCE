<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>CDCE</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2a6df4">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:light;--bg:#eef0fb;--c:rgba(255,255,255,.80);--cs:rgba(255,255,255,.95);--t:#1c2340;--m:#6a7396;--a:#5b6cff;--a2:#8b5cf6;--b:rgba(110,120,190,.18);--g:#2bb48f;--r:#ee5a74;--hot:#ff5c93;--field:rgba(255,255,255,.72);--glow:rgba(91,108,255,.34);--sh:0 14px 34px -22px rgba(70,80,170,.5);--bl1:rgba(176,160,255,.55);--bl2:rgba(130,205,255,.5);--bl3:rgba(255,184,220,.38);--mb:linear-gradient(135deg,#5b6cff,#8b5cf6);--mt:#fff;--ob:rgba(255,255,255,.9);--wp:transparent}
:root[data-theme="dark"]{--bg:#0a0e1d;--c:rgba(24,30,58,.74);--cs:rgba(18,23,46,.96);--t:#eceffd;--m:#97a1c9;--a:#7d8cff;--a2:#a78bfa;--b:rgba(140,155,255,.14);--g:#34c29c;--r:#f0617a;--field:rgba(255,255,255,.05);--glow:rgba(125,140,255,.5);--sh:0 14px 34px -22px rgba(0,0,0,.8);--bl1:rgba(91,92,255,.30);--bl2:rgba(20,184,200,.16);--bl3:rgba(168,70,200,.17);--ob:rgba(34,42,76,.84);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e1d;--c:rgba(24,30,58,.74);--cs:rgba(18,23,46,.96);--t:#eceffd;--m:#97a1c9;--a:#7d8cff;--a2:#a78bfa;--b:rgba(140,155,255,.14);--g:#34c29c;--r:#f0617a;--field:rgba(255,255,255,.05);--glow:rgba(125,140,255,.5);--sh:0 14px 34px -22px rgba(0,0,0,.8);--bl1:rgba(91,92,255,.30);--bl2:rgba(20,184,200,.16);--bl3:rgba(168,70,200,.17);--ob:rgba(34,42,76,.84);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:rgba(130,140,220,.35) transparent}
html,body{height:100%;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;font-size:15px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--t);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
button,input,select,textarea{font-family:inherit}
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bl{position:absolute;border-radius:50%;width:70vmax;height:70vmax;}
.b1{top:-26vmax;right:-22vmax;background:radial-gradient(circle,var(--bl1),transparent 65%)}
.b2{bottom:-32vmax;left:-26vmax;background:radial-gradient(circle,var(--bl2),transparent 65%);animation-duration:31s}
.b3{top:34%;left:26%;width:48vmax;height:48vmax;background:radial-gradient(circle,var(--bl3),transparent 65%);animation-duration:37s}
@keyframes dr{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-7vmax,6vmax,0) scale(1.12)}}
.fi{position:absolute;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:22px;filter:saturate(.75);opacity:.55;background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.25));border:1px solid rgba(255,255,255,.7);box-shadow:0 14px 30px -14px var(--glow);animation:fl var(--d,18s) ease-in-out infinite;animation-delay:var(--s,0s);will-change:transform}
:root[data-theme="dark"] .fi{opacity:.42;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);box-shadow:0 0 28px -6px var(--glow)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .fi{opacity:.42;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);box-shadow:0 0 28px -6px var(--glow)}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-24px) rotate(6deg)}}
#v{flex:1;overflow:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom,0px));position:relative;z-index:1}
h2{margin:0 0 10px;font-size:22px;font-weight:800}h3{margin:14px 0 6px;font-size:16px;font-weight:700}
.card{background:var(--c);border:1px solid var(--b);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}
.btn{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border:0;border-radius:16px;padding:11px 16px;font:inherit;font-weight:700;box-shadow:0 8px 20px -10px var(--glow);transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn.o{background:rgba(110,120,255,.08);color:var(--a);border:1px solid rgba(110,120,255,.4);box-shadow:none}
.btn.g{background:linear-gradient(135deg,#2bb48f,#22a5a0)}.btn.r{background:linear-gradient(135deg,#f0617a,#e0456f)}
.av{width:46px;height:46px;border-radius:32%;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none;object-fit:cover;box-shadow:0 8px 18px -10px var(--glow)}
.av.big{width:92px;height:92px;font-size:34px;margin:auto}
.tag{font-size:12px;background:rgba(110,120,255,.10);border:1px solid var(--b);border-radius:10px;padding:3px 10px;color:var(--m);display:inline-block;margin:2px}
.m{color:var(--m);font-size:13px}.grow{flex:1}
input,select,textarea{width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--b);background:var(--field);color:var(--t);font:inherit;margin:5px 0;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(110,120,255,.2),0 0 18px -4px var(--glow)}
#tb{order:-1;position:relative;z-index:3;display:flex;align-items:center;gap:12px;margin:10px 12px 2px;padding:8px 10px;border-radius:24px;background:var(--c);border:1px solid var(--b);box-shadow:var(--sh)}
#nav[hidden]~#tb{display:none!important}
#mnu{width:44px;height:44px;border-radius:15px;border:1px solid var(--b);background:rgba(110,120,255,.10);display:flex;align-items:center;justify-content:center;gap:4px;position:relative;padding:0}
#mnu i{width:5px;height:5px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--glow)}
#mnu.has::after{content:"";position:absolute;top:6px;inset-inline-end:6px;width:9px;height:9px;border-radius:50%;background:var(--hot);box-shadow:0 0 10px var(--hot)}
.tbt{flex:1;font-weight:800;font-size:18px}
.tbl{font-weight:800;font-size:12px;letter-spacing:2px;padding:7px 11px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 0 18px -4px var(--glow)}
#nav{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(84vw,330px);z-index:29;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));background:var(--cs);border:1px solid var(--b);border-radius:28px 0 0 28px;transform:translateX(106%);transition:transform .26s cubic-bezier(.22,1,.36,1)}
#nav[hidden]{display:none!important}
#nav.open{transform:none;box-shadow:-24px 0 70px -26px var(--glow)}
.dh{display:flex;align-items:center;gap:12px;padding:6px 6px 14px;border-bottom:1px solid var(--b);margin-bottom:10px}.dh .av{width:50px;height:50px}.dh b{font-size:16px}
.dl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.dl button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:18px;border:1px solid transparent;background:none;color:var(--t);font:inherit;font-weight:500;font-size:15px;text-align:start;}
@keyframes slin{to{opacity:1;transform:none}}
.dl button b{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:400;background:rgba(110,120,255,.12);border:1px solid var(--b);flex:none}
.dl button.on{background:linear-gradient(135deg,rgba(110,120,255,.20),rgba(139,92,246,.12));border-color:rgba(110,120,255,.45);box-shadow:0 0 22px -8px var(--glow);font-weight:800}
.dl button.on b{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;box-shadow:0 0 14px -2px var(--glow)}
.dl .bg{margin-inline-start:auto;position:static;top:auto}
#dov{position:fixed;inset:0;z-index:28;background:rgba(8,12,30,.45);opacity:0;pointer-events:none;transition:opacity .35s}#dov.open{opacity:1;pointer-events:auto}
.logo{width:90px;height:90px;border-radius:28%;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;margin:auto}
@keyframes pulse{0%,100%{box-shadow:0 0 26px -6px var(--glow)}50%{box-shadow:0 0 50px 0 var(--glow)}}
.qr{max-width:180px;width:100%;border:2px dashed var(--b);border-radius:18px;display:grid;place-items:center;color:var(--m);font-size:12px;margin:auto;min-height:120px}
.memo{background:rgba(110,120,255,.06);border:1px solid var(--b);border-radius:16px;padding:10px;margin-top:8px}
.msgs{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--c);border:1px solid var(--b);align-self:flex-start;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--mb);color:#fff;border:0}.bub small{display:block;font-size:11px;opacity:.7}
.send{display:flex;gap:6px;position:sticky;bottom:0;background:var(--c);padding:6px 0}.send input{margin:0}
.sub{display:flex;gap:8px;margin-bottom:10px}.sub .btn{flex:1}
#ld{display:none;position:fixed;top:0;left:0;right:0;height:4px;z-index:40;background:linear-gradient(90deg,transparent,var(--a),var(--a2),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:ld 1s linear infinite}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
#tt{display:none;position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:14px;right:14px;background:var(--cs);color:var(--t);border:1px solid var(--b);padding:13px;border-radius:18px;text-align:center;z-index:50;box-shadow:0 14px 40px -14px var(--glow);animation:rise .35s cubic-bezier(.22,1,.36,1)}
#ov{display:none;position:fixed;inset:0;background:rgba(8,12,30,.6);z-index:45;place-items:center}
#v.cm{padding:0;display:flex;flex-direction:column;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:6px 12px 0;background:var(--c);border:1px solid var(--b);border-radius:20px;}
.ch .av{width:40px;height:40px;font-size:18px}
.ib{background:none;border:0;font-size:22px;padding:6px 8px;color:var(--t);flex:none;font-family:inherit}
.ib.sd{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-radius:16px;width:44px;height:44px;padding:0;box-shadow:0 8px 20px -8px var(--glow)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 6px;gap:3px;margin:0;background:transparent;background-image:radial-gradient(rgba(128,140,220,.16) 1px,transparent 1px);background-size:20px 20px}
.w{display:flex;margin:1px 0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.w.me{justify-content:flex-end}
.b{max-width:82%;background:var(--ob);color:var(--t);border:1px solid var(--b);border-radius:18px;border-end-start-radius:6px;padding:7px 11px 5px;box-shadow:0 4px 14px -10px rgba(40,50,120,.5);white-space:pre-wrap;word-break:break-word}
.w.me .b{background:var(--mb);color:var(--mt);border:0;border-end-start-radius:18px;border-end-end-radius:6px;box-shadow:0 8px 20px -12px var(--glow)}
.b.nb{background:none;box-shadow:none;border:0}
.sn{display:block;font-size:12px;margin-bottom:2px;font-weight:700}
.mt{display:block;text-align:end;font-size:10px;opacity:.7;margin-top:2px;white-space:nowrap}
.tk{color:var(--m);letter-spacing:-3px;margin-inline-start:2px}.tk.rd{color:#34b7f1}
.rq{background:rgba(128,128,128,.16);border-inline-start:4px solid var(--a);border-radius:10px;padding:4px 8px;margin-bottom:4px;font-size:12px}
.ds{text-align:center;margin:8px 0}.ds span{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:3px 10px;font-size:12px;color:var(--m)}
.mi{max-width:240px;width:100%;max-height:300px;min-height:90px;border-radius:14px;display:block;background:rgba(128,128,128,.2);object-fit:cover}
.stk{width:130px;height:130px;object-fit:contain;display:block}.stk.em{font-size:76px;line-height:1.1;width:auto;height:auto}
.au{display:flex;align-items:center;gap:6px;min-width:210px}.au input{margin:0;padding:0;flex:1}.au button{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border:0;border-radius:12px;width:34px;height:34px;flex:none}
.fl{display:flex;gap:6px;align-items:center;background:rgba(128,128,128,.16);border-radius:14px;padding:10px}
.cmp{display:flex;align-items:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--c);border-top:1px solid var(--b);}.cmp input{margin:0;border-radius:22px;flex:1;min-width:0}
.rb{padding:6px 10px;background:var(--c);border-top:1px solid var(--b)}
.rbx{display:flex;gap:8px;align-items:center;border-inline-start:4px solid var(--a);padding:4px 8px;background:rgba(110,120,255,.06);border-radius:10px}
.hl .b{outline:2px solid var(--a)}.w.pend .b{opacity:.65}.w.fail .b{opacity:1;outline:1px solid var(--r)}.w.fail b{cursor:pointer;color:var(--a)}
#sh{display:none;position:fixed;inset:0;background:rgba(8,12,30,.5);z-index:46;align-items:flex-end;justify-content:center}
.sh{background:var(--cs);width:100%;max-width:520px;border:1px solid var(--b);border-bottom:0;border-radius:28px 28px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));max-height:75vh;overflow:auto;box-shadow:0 -24px 60px -28px var(--glow);animation:up .4s cubic-bezier(.22,1,.36,1)}
.sh::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--b);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.it{display:block;width:100%;text-align:start;background:none;border:0;border-radius:14px;padding:14px 12px;font:inherit;color:var(--t);transition:background .2s}.it:active{background:rgba(110,120,255,.12)}
.sg{display:flex;flex-wrap:wrap;gap:6px}.se{font-size:34px;padding:4px;display:inline-grid;place-items:center}
.se.add{border:2px dashed var(--b);border-radius:16px;width:64px;height:64px;font-size:26px}
.ss{position:relative}.ss img{width:64px;height:64px;object-fit:contain}
.ss b{position:absolute;top:-4px;right:-4px;background:var(--r);color:#fff;border-radius:8px;width:20px;height:20px;font-size:12px;display:grid;place-items:center}
#vw{display:none;position:fixed;inset:0;background:#000;z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:10px}#vw img{max-width:100%;max-height:82%}#vw a{color:#fff}
.bg,.bg2{background:linear-gradient(135deg,var(--hot),var(--a2));color:#fff;border-radius:10px;font-size:10px;font-style:normal;padding:1px 7px;box-shadow:0 0 12px -3px var(--hot)}
.bg{position:relative;top:-8px}.bg2{display:inline-block;font-size:12px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
#v[data-pg]>*{animation:rise .26s ease-out both}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.dl button{opacity:1;transform:none}}

html[data-fx=full] #tb,html[data-fx=full] #nav,html[data-fx=full] .sh,html[data-fx=full] .ch,html[data-fx=full] .cmp,html[data-fx=full] #tt{backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
html[data-fx=full] .bl{animation:dr 26s ease-in-out infinite alternate;will-change:transform}
html[data-fx=full] .dl button{opacity:0;transform:translateX(14px)}
html[data-fx=full] #nav.open .dl button{animation:slin .4s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i)*28ms)}
html[data-fx=full] .logo{animation:pulse 3s ease-in-out infinite}
html[data-fx=off] .fi{display:none}
html[data-fx=off] *{animation:none!important;transition:none!important}
:root[dir=ltr] #nav{transform:translateX(-106%);border-radius:0 28px 28px 0}
:root[dir=ltr] #nav.open{transform:none;box-shadow:24px 0 70px -26px var(--glow)}
.sg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:124px;padding:14px 10px;border-radius:22px;background:var(--c);border:1px solid var(--b);box-shadow:var(--sh);color:var(--t);font:inherit;font-weight:700;font-size:14px;text-align:center;transition:transform .15s}
.tl:active{transform:scale(.97)}
.tl b{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:27px;font-weight:400;background:rgba(110,120,255,.12);border:1px solid var(--b)}
.tl:last-child:nth-child(odd){grid-column:1/-1}
.sph{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sph h2{margin:0}

#tour{position:fixed;inset:0;z-index:70;display:none}
#tour.on{display:block}
#tdim{position:absolute;inset:0;background:rgba(8,12,30,.66);transition:opacity .3s}
#tour.sp #tdim{opacity:0}
#tsp{position:absolute;border-radius:20px;pointer-events:none;opacity:0;box-shadow:0 0 0 9999px rgba(8,12,30,.66),0 0 0 3px var(--a),0 0 26px 4px var(--glow);transition:left .45s cubic-bezier(.22,1,.36,1),top .45s cubic-bezier(.22,1,.36,1),width .45s cubic-bezier(.22,1,.36,1),height .45s cubic-bezier(.22,1,.36,1),opacity .3s}
#tour.sp #tsp{opacity:1}
#thand{position:absolute;font-size:34px;line-height:1;pointer-events:none;opacity:0;transition:left .45s cubic-bezier(.22,1,.36,1),top .45s cubic-bezier(.22,1,.36,1),opacity .3s;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
#tour.sp.hd #thand{opacity:1;animation:poke 1s ease-in-out infinite}
@keyframes poke{0%,100%{margin-top:0}50%{margin-top:9px}}
#tbox{position:absolute;inset-inline:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:6px}
#tbox.top{bottom:auto;top:calc(88px + env(safe-area-inset-top,0px))}
#trob{width:92px;height:100px;flex:none;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(80,90,200,.45))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#trob .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#trob .armR{transform-box:fill-box;transform-origin:50% 8%;animation:wave 1.8s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
#trob .ant circle{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
#trob .mouth{transform-box:fill-box;transform-origin:center}
#tour.say #trob .mouth{animation:talk .28s infinite}
@keyframes talk{50%{transform:scaleY(2)}}
#tbub{flex:1;min-width:0;background:var(--cs);border:1px solid var(--b);border-radius:22px;padding:14px;box-shadow:0 16px 40px -16px var(--glow);position:relative;max-height:48vh;display:flex;flex-direction:column;animation:rise .35s ease-out}
#tbub::before{content:"";position:absolute;inset-inline-start:-9px;bottom:30px;width:10px;height:18px;background:var(--cs);clip-path:polygon(100% 0,0 50%,100% 100%)}
:root[dir=rtl] #tbub::before{transform:scaleX(-1)}
#ttl{font-weight:800;font-size:16px;margin-bottom:6px}
#ttx{white-space:pre-wrap;line-height:1.75;overflow:auto;font-size:14.5px;min-height:1.7em}
#ttx a{color:var(--a);font-weight:700}
.tctl{display:flex;gap:8px;align-items:center;margin-top:10px}
.tprog{height:5px;border-radius:5px;background:var(--b);overflow:hidden;margin-top:12px}.tprog i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .4s}
.tctl .btn{padding:8px 14px;box-shadow:none;font-size:14px;white-space:nowrap;flex:none}
.tctl .btn[disabled]{opacity:.35}

html,body{overscroll-behavior-y:contain}
#v{overscroll-behavior-y:contain}

/* Excel */
const XLSXMIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const IS_NATIVE=()=>!!(window.Capacitor&&typeof window.Capacitor.isNativePlatform=='function'&&window.Capacitor.isNativePlatform());
const openExt=u=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)};
const shSaveFile=async(bytes,fname)=>{const C=window.Capacitor&&window.Capacitor.Plugins;
 if(IS_NATIVE()){
  if(C&&C.Filesystem&&C.Share){let b='';const u8=new Uint8Array(bytes);for(let i=0;i<u8.length;i+=0x8000)b+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));const r=await C.Filesystem.writeFile({path:fname,data:btoa(b),directory:'CACHE'});await C.Share.share({title:fname,url:r.uri,dialogTitle:'حفظ / مشاركة الشيت'});return 'share'}
  const path=ME.user_id+'/sheet.xlsx',blob=new Blob([bytes],{type:XLSXMIME});
  const up=await sb.storage.from('exports').upload(path,blob,{upsert:true,contentType:XLSXMIME});if(up.error)throw up.error;

 await Promise.all(SVC.map(async x=>{PNG[x.key]=await pingOne(x)}));
}catch(e){SYS=SYS||{};SVC=SVC||[];ERR=ERR||[];toast('تعذّر تحميل بيانات النظام')}finally{SYSBUSY=false;draw()}};
const sysUse=k=>{if(!SYS)return null;const m=SYS.media||{};return({db_bytes:SYS.db_bytes,storage_bytes:SYS.storage_bytes,users:SYS.users,uc_bytes:(m.uploadcare||{}).bytes,cl_bytes:(m.cloudinary||{}).bytes})[k]};
const sysBar=(lb,used,max,f)=>{const p=max?Math.min(100,used/max*100):0,c=p>=90?'#ef4444':p>=70?'#f59e0b':'#22c55e';return `<div class="m" style="margin-top:8px">${esc(lb)}: <b>${f(used)}</b> / ${f(max)} (${p.toFixed(p<10?1:0)}%)</div><div style="height:8px;border-radius:6px;background:var(--b);overflow:hidden"><div style="width:${p}%;height:100%;background:${c}"></div></div>`};
const sysLim=l=>{const max=l.gb?l.gb*1073741824:l.count,u=l.usage?sysUse(l.usage):null,f=l.gb?fb:(x=>Number(x).toLocaleString('en'));
 if(u==null||u===undefined)return `<div class="m" style="margin-top:8px">${esc(l.label)}: الحد ${f(max)} <small>(مش بنقدر نقيسه من هنا)</small></div>`;return sysBar(l.label,u,max,f)};
const sysCard=x=>{const p=PNG[x.key];
 const st=x.status=='planned'?'<span class="tag">⏳ قيد الإعداد</span>':x.status=='off'?'<span class="tag">⛔ متوقف</span>':p===undefined?'<span class="tag">... بيفحص</span>':p.ok===null?'<span class="tag">—</span>':p.ok?`<span class="tag" style="color:#22c55e">🟢 شغّال • ${p.ms}ms</span>`:'<span class="tag" style="color:#ef4444">🔴 مش بيرد</span>';
 const lk=(u,t)=>u?`<a class="btn o" style="padding:6px 12px;display:inline-block;text-decoration:none" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:'';
 return `<div class="card"><div class="row"><b class="grow">${KI[x.kind]||'🔌'} ${esc(x.name)}</b>${st}</div>${x.notes?`<p class="m">${esc(x.notes)}</p>`:''}${(x.limits||[]).map(sysLim).join('')}
 <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap">${lk(x.site_url,'🔗 الموقع')}${lk(x.dashboard_url,'⚙️ لوحة التحكم')}<button class="btn o" style="padding:6px 12px" onclick="svcEdit('${x.key}')">✏️ تعديل</button></div></div>`};
const svcEdit=k=>{const x=k?(SVC||[]).find(y=>y.key==k):{};if(k&&!x)return;const lm=x.limits||[],multi=lm.length>1,l=lm[0]||{};
 sheet(`<h3>${k?'تعديل':'إضافة'} موقع مرتبط</h3><input id="sv_n" placeholder="الاسم" value="${esc(x.name||'')}"><select id="sv_k">${Object.keys(KI).map(y=>`<option value="${y}" ${y==(x.kind||'other')?'selected':''}>${KI[y]} ${y}</option>`).join('')}</select><select id="sv_s">${[['active','شغّال'],['planned','قيد الإعداد'],['off','متوقف']].map(y=>`<option value="${y[0]}" ${y[0]==(x.status||'active')?'selected':''}>${y[1]}</option>`).join('')}</select><input id="sv_u" placeholder="رابط الموقع" value="${esc(x.site_url||'')}"><input id="sv_d" placeholder="رابط لوحة التحكم" value="${esc(x.dashboard_url||'')}"><input id="sv_p" placeholder="رابط فحص الحالة (اختياري)" value="${esc(x.ping_url||'')}">${multi?'<p class="m">الحدود المتعددة بتتعدّل بالمساعدة، مش من هنا.</p>':`<input id="sv_ll" placeholder="اسم الحد (مثال: التخزين)" value="${esc(l.label||'')}"><input id="sv_lg" type="number" step="0.1" placeholder="قيمة الحد بالجيجا" value="${l.gb||''}">`}<input id="sv_nt" placeholder="ملاحظة" value="${esc(x.notes||'')}"><button class="btn g" style="width:100%;margin-top:8px" onclick="svcSave('${k||''}')">حفظ</button>${k?`<button class="btn r" style="width:100%;margin-top:6px" onclick="svcDel('${k}')">حذف</button>`:''}`)};
const svcSave=k=>{const old=k?(SVC||[]).find(y=>y.key==k):null,nm=$('#sv_n').value.trim();if(!nm)return toast('اكتب الاسم');
 const multi=old&&(old.limits||[]).length>1;let lim=multi?old.limits:[];
 if(!multi){const lb=($('#sv_ll')||{}).value,g=parseFloat(($('#sv_lg')||{}).value);if(lb&&g>0){lim=[{label:lb,gb:g}];const u=old&&(old.limits||[])[0]&&old.limits[0].usage;if(u)lim[0].usage=u}}
 run(async()=>{await q(sb.rpc('dev_save_service',{p:{key:k||null,name:nm,kind:$('#sv_k').value,status:$('#sv_s').value,site_url:$('#sv_u').value.trim(),dashboard_url:$('#sv_d').value.trim(),ping_url:$('#sv_p').value.trim(),limits:lim,notes:$('#sv_nt').value.trim(),sort:old?old.sort:50}}));closeSh();toast('اتحفظ ✅');SYS=null;draw()})};
const svcDel=async k=>{if(!await uiConfirm('حذف الموقع ده من القائمة؟ (مش بيمسح الموقع نفسه، بس بيشيله من هنا)'))return;run(async()=>{await q(sb.rpc('dev_delete_service',{p_key:k}));closeSh();toast('اتحذف');SYS=null;draw()})};
const errClear=async ()=>{if(!await uiConfirm('مسح كل الأخطاء المسجّلة؟'))return;run(async()=>{await q(sb.rpc('dev_clear_errors'));SYS=null;draw()})};
const sSys=()=>{if(SYS===null){loadSys();return '<div class="card m">بيحمّل بيانات النظام...</div>'}
 const m=SYS.media||{},ago=SYSAT?Math.round((Date.now()-SYSAT)/1000):0;
 const mrow=(n,l)=>{const x=m[n];return x?`<div class="m">${l}: ${x.n} ملف • ${fb(x.bytes)}${x.unknown?` <small>(${x.unknown} قديم من غير حجم)</small>`:''}</div>`:''};
 const er=ERR||[];
 return `<div class="card"><div class="row"><h3 class="grow">🛰️ حالة النظام</h3><button class="btn o" style="padding:6px 14px" onclick="SYS=null;draw()">🔄 تحديث</button></div><p class="m">آخر تحديث من ${ago} ثانية. أي موقع بنربط التطبيق بيه بيظهر هنا.</p></div>`
 +(SVC||[]).map(sysCard).join('')
 +`<button class="btn g" style="width:100%;margin:8px 0" onclick="svcEdit('')">➕ إضافة موقع مرتبط</button>`
 +`<div class="card"><h3>📊 التطبيق</h3><div class="m">الأعضاء: <b>${SYS.users}</b></div><div class="m">الرسائل: اليوم <b>${SYS.msgs_24h}</b> • الأسبوع <b>${SYS.msgs_7d}</b> • الكل <b>${SYS.msgs_total}</b></div>${mrow('uploadcare','🖼️ صور (Uploadcare)')}${mrow('cloudinary','🎬 فيديو (Cloudinary)')}${mrow('supabase','📁 ملفات وصوت (Supabase)')}</div>`
 +`<div class="card"><h3>🔐 الأمان</h3><div class="m">محاولات كود غلط (24 ساعة): <b>${SYS.code_failed_24h}</b> • ناجحة: <b>${SYS.code_ok_24h}</b></div><div class="m">طلبات كلمة السر: <b>${SYS.pw_requests}</b></div></div>`
 +`<div class="card"><div class="row"><h3 class="grow">🐞 آخر الأخطاء (${SYS.errors_24h} في 24 ساعة)</h3>${er.length?'<button class="btn o" style="padding:6px 14px" onclick="errClear()">مسح</button>':''}</div>${er.length?er.map(e=>`<div class="m" style="border-top:1px solid var(--b);padding:6px 0"><b>${esc(e.msg)}</b><br><small>${esc(e.full_name||'؟')} • ${new Date(e.created_at).toLocaleString(LOCALE())}${e.src?' • '+esc(String(e.src).split('/').pop())+(e.line?':'+e.line:''):''}</small></div>`).join(''):'<p class="m">مفيش أخطاء مسجّلة 🎉</p>'}</div>`};

/* ===== 🛡️ الصلاحيات الدقيقة (للمطور فقط) ===== */
let PM={dep:'',rk:null,pid:'',CAT:null,GR:{},err:''};
const pmHas=(id,k)=>!!(PM.GR[id]&&PM.GR[id].has(k));
const pmList=()=>P.filter(x=>!x.is_memorial&&x.rank!='leader'&&(!PM.dep||x.department_id==PM.dep)&&(PM.rk===''||x.rank==PM.rk));
const pmSel=()=>PM.rk===null?[]:(PM.pid?pmList().filter(x=>x.id==PM.pid):pmList());
const loadPerm=async()=>{await run(async()=>{const c=await q(sb.rpc('list_caps'));const g=await q(sb.rpc('dev_list_grants',{p_profile:null}));PM.CAT=c||[];PM.GR={};(g||[]).forEach(x=>{(PM.GR[x.profile_id]=PM.GR[x.profile_id]||new Set()).add(x.cap)})});draw()};
const pmSet=(f,v)=>{PM[f]=v;if(f=='rk'||f=='dep')PM.pid='';draw()};
const pmTap=async k=>{const c=PM.CAT.find(x=>x.key==k),S=pmSel().filter(x=>n(x)<c.default_rank);if(!S.length)return;const on=!S.every(x=>pmHas(x.id,k));
 if(on&&c.sensitive&&!await uiConfirm('⚠️ "'+c.label+'" صلاحية حساسة.\nهتدّيها لـ '+S.length+' شخص. متأكد؟'))return;
 run(async()=>{await q(sb.rpc('dev_set_caps',{p_profiles:S.map(x=>x.id),p_caps:[k],p_on:on,p_confirm:true}));toast(on?'اتمنحت ✅':'اتسحبت');await loadPerm()})};
const sPerm=()=>{if(PM.CAT===null){PM.CAT=[];loadPerm();return '<div class="card m">بيحمّل الصلاحيات...</div>'}
 if(!PM.CAT.length)return '<div class="card m">مفيش بيانات صلاحيات. اتأكد إن دالة list_caps اتنفذت في الداتابيز.</div>';
 const S=pmSel(),L=pmList();
 const rkOpts='<option value=""'+(PM.rk===null?' selected':'')+' disabled>اختار الرتبة...</option><option value="" '+(PM.rk===''?'selected':'')+'>الكل (كل الرتب)</option>'+RKS.filter(r=>r!='leader').map(r=>`<option value="${r}" ${PM.rk===r?'selected':''}>${RN[r]}</option>`).join('');
 const depOpts='<option value="">كل اللجان / الأقسام</option>'+DEP.map(d=>`<option value="${d.id}" ${PM.dep==d.id?'selected':''}>${esc((d.emoji||'')+' '+d.name)}</option>`).join('');
 const whoOpts='<option value="">الكل ('+L.length+')</option>'+L.map(x=>`<option value="${x.id}" ${PM.pid==x.id?'selected':''}>${esc(x.full_name)}</option>`).join('');
 let h=`<div class="card"><h3>🛡️ منح الصلاحيات</h3><p class="m">اختار اللجنة، وبعدين الرتبة، وبعدين الشخص (أو الكل). دوس على أي صلاحية تتمنح أو تتسحب. الليدر والمطور مش بيتمنحوا.</p>
 <label class="m">اللجنة</label><select onchange="pmSet('dep',this.value)">${depOpts}</select>
 <label class="m">الرتبة</label><select onchange="pmSet('rk',this.value)">${rkOpts}</select>
 ${PM.rk!==null?`<label class="m">الشخص</label><select onchange="pmSet('pid',this.value)">${whoOpts}</select>`:''}</div>`;
 if(PM.rk===null)return h;
 if(!S.length)return h+'<div class="card m">مفيش أشخاص مطابقين للاختيار ده.</div>';
 h+=`<div class="card"><b>المختارين: ${S.length}</b><div class="m">${esc(S.slice(0,6).map(x=>x.full_name).join('، '))}${S.length>6?' ...':''}</div></div>`;
 const groups=[...new Set(PM.CAT.map(c=>c.grp))];
 h+=groups.map(g=>`<div class="card"><h3>${esc(g)}</h3><table style="width:100%;border-collapse:collapse">`+PM.CAT.filter(c=>c.grp==g).map(c=>{
  const free=S.filter(x=>n(x)>=c.default_rank).length,rest=S.filter(x=>n(x)<c.default_rank),have=rest.filter(x=>pmHas(x.id,c.key)).length;
  let st,tap=true;
  if(!rest.length){st='<span class="m">✔ بالرتبة</span>';tap=false}
  else if(have==rest.length)st='✅';
  else if(have>0)st='➖ '+have+'/'+rest.length;
  else st='⬜';
  return `<tr style="border-top:1px solid var(--b,#8883)" ${tap?`onclick="pmTap('${c.key}')"`:''}><td style="padding:10px 4px">${esc(c.label)}${c.sensitive?' <span class="tag">حساسة</span>':''}${free&&rest.length?` <span class="m">(${free} عندهم بالرتبة)</span>`:''}</td><td style="width:64px;text-align:center;font-size:18px">${st}</td></tr>`}).join('')+'</table></div>').join('');
 return h};
const sRst=()=>`<div class="card"><h3>طلبات نسيان كلمة السر</h3>${RES.map(r=>`<div class="memo"><b>${esc(r.full_name)}</b> <span class="tag">${RL(r)}</span><input id="rp_${r.id}" placeholder="كلمة سر مؤقتة (6+)"><button class="btn g" onclick="doReset('${r.id}')">تعيين</button></div>`).join('')||'<p class="m">مفيش طلبات.</p>'}</div>`;
const doReset=id=>run(async()=>{await q(sb.rpc('admin_reset',{req:id,newpw:$('#rp_'+id).value}));toast('اتعيّنت كلمة السر المؤقتة ✅');await openStg()});
(()=>{let n=0;const rep=(m,s,l)=>{try{if(!U||n>=5)return;n++;sb.rpc('log_client_error',{p_msg:String(m||'').slice(0,500),p_src:String(s||'').slice(0,200),p_line:l||null,p_ua:navigator.userAgent.slice(0,200)}).then(()=>{},()=>{})}catch(e){}};
 window.addEventListener('error',e=>rep(e.message,e.filename,e.lineno));window.addEventListener('unhandledrejection',e=>rep('Promise: '+((e.reason&&e.reason.message)||e.reason),'',0))})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
boot();
</script></body></html>
