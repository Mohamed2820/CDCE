const saveMem=id=>run(async()=>{await q(sb.from('profiles').update({full_name:$('#mn_'+id).value.trim()||'بدون اسم',title:$('#mt_'+id).value.trim()||null}).eq('id',id));await load();toast('اتحفظ ✅');draw()});
const delMem=id=>{if(!confirm('حذف بروفايل الليدر السابق؟'))return;run(async()=>{await q(sb.from('profiles').delete().eq('id',id));await load();draw()})};
const addMem=()=>{const nm=$('#nm').value.trim();if(!nm)return toast('اكتب الاسم');run(async()=>{await q(sb.from('profiles').insert({full_name:nm,is_memorial:true,rank:'leader',title:'الليدر السابق'}));await load();toast('اتضاف ✅');draw()})};
const sCodes=()=>`<div class="card"><h3>إنشاء كود</h3><select id="cr">${RKS.slice(0,4).map(k=>`<option value="${k}">${RN[k]}</option>`).join('')}</select><select id="cd">${DEP.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><input id="cl" placeholder="اسم الشخص (للتذكير)"><button class="btn" onclick="mkCode()">إنشاء كود</button></div>`+CODES.map(c=>{const e=ec==c.code&&!c.used_by;
 return `<div class="card"><b style="letter-spacing:2px">${esc(c.code)}</b> `+(e?`<select id="xr">${RKS.slice(0,4).map(k=>`<option value="${k}" ${k==c.rank?'selected':''}>${RN[k]}</option>`).join('')}</select><select id="xd">${DEP.map(d=>`<option value="${d.id}" ${d.id==c.department_id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><input id="xl" value="${esc(c.label||'')}"><button class="btn g" onclick="saveCode('${c.code}')">حفظ</button> <button class="btn o" onclick="ec=null;draw()">إلغاء</button>`:`<span class="tag">${RL(c)}</span><span class="tag">${esc(dn(c.department_id))}</span><div class="m">${esc(c.label||'')} ${c.used_by?'• ✅ اتستخدم: '+esc(nameBy(c.used_by)):'• متاح'}</div><div class="row">${c.used_by||c.rank=='leader'?'':`<button class="btn o" onclick="ec='${c.code}';draw()">تعديل</button>`}<button class="btn r" onclick="delCode('${c.code}')">حذف</button></div>`)+'</div>'}).join('');
const mkCode=()=>run(async()=>{const c=await q(sb.rpc('make_code',{r:$('#cr').value,d:$('#cd').value,lbl:$('#cl').value||null}));toast('الكود: '+c);await openStg()});
const saveCode=c=>run(async()=>{await q(sb.from('invite_codes').update({rank:$('#xr').value,department_id:$('#xd').value,label:$('#xl').value||null}).eq('code',c));ec=null;await openStg()});
const delCode=c=>{if(!confirm('حذف الكود '+c+'؟'))return;run(async()=>{await q(sb.from('invite_codes').delete().eq('code',c));await openStg()})};

const cqSlots=()=>{const o=[];['member','board','assistant_head','head'].forEach(k=>o.push({rank:k,rd:null,name:RN[k]}));(RD||[]).forEach(d=>o.push({rank:d.base,rd:d.id,name:d.name}));return o.sort((a,b)=>RKS.indexOf(a.rank)-RKS.indexOf(b.rank))};
const loadCQ=async()=>{try{CQ=await q(sb.rpc('list_code_questions'))}catch(e){CQ=[]}draw()};
const cqFind=s=>(CQ||[]).find(x=>x.rank==s.rank&&(x.rank_def||null)==(s.rd||null));
let CQS=[];
const sCq=()=>{if(CQ===null){loadCQ();return '<div class="card m">بيحمّل...</div>'}CQS=cqSlots();
 return '<div class="card"><h3>❓ أسئلة طلب الكود</h3><p class="m">لكل رتبة سؤال وإجابة. الشخص اللي يجاوب صح بياخد كود دعوة بالرتبة دي. الإجابة مش بتظهر هنا، اكتب إجابة جديدة بس لو عايز تغيّرها. الأرقام والتشكيل والهمزات مش بتفرق.</p></div>'+CQS.map((s,i)=>{const c=cqFind(s);return `<div class="card"><div class="row"><b class="grow">${esc(s.name)}</b><span class="tag">${c?'✅ متفعّل':'مفيش سؤال'}</span></div><input id="cqq_${i}" placeholder="السؤال" value="${esc(c?c.question:'')}"><input id="cqa_${i}" placeholder="${c?'إجابة جديدة (سيبها فاضية لو مش عايز تغيّرها)':'الإجابة'}"><div class="row" style="gap:6px"><button class="btn g grow" onclick="saveCq(${i})">حفظ</button>${c?`<button class="btn r" onclick="delCq('${c.id}')">حذف</button>`:''}</div></div>`}).join('')};
const saveCq=i=>{const s=CQS[i],qq=($('#cqq_'+i).value||'').trim(),a=($('#cqa_'+i).value||'').trim();if(!cqFind(s)&&(!qq||!a))return toast('اكتب السؤال والإجابة');run(async()=>{await q(sb.rpc('save_code_question',{p_rank:s.rank,p_rank_def:s.rd,p_question:qq||null,p_answer:a||null}));toast('اتحفظ ✅');CQ=null;draw()})};
const delCq=id=>{if(!confirm('حذف السؤال ده؟ الرتبة دي مش هتقدر تطلب كود.'))return;run(async()=>{await q(sb.rpc('delete_code_question',{p_id:id}));CQ=null;draw()})};
const sRst=()=>`<div class="card"><h3>طلبات نسيان كلمة السر</h3>${RES.map(r=>`<div class="memo"><b>${esc(r.full_name)}</b> <span class="tag">${RL(r)}</span><input id="rp_${r.id}" placeholder="كلمة سر مؤقتة (6+)"><button class="btn g" onclick="doReset('${r.id}')">تعيين</button></div>`).join('')||'<p class="m">مفيش طلبات.</p>'}</div>`;
const doReset=id=>run(async()=>{await q(sb.rpc('admin_reset',{req:id,newpw:$('#rp_'+id).value}));toast('اتعيّنت كلمة السر المؤقتة ✅');await openStg()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
